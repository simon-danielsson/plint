<header>
    <span class="header-left">
        <img src="logo.png" alt="plint logo" />
        <a style="text-decoration: none;" href="/"><h1>{{ site_title }}</h1></a>
        <span class="header-center">
            <a href="/about">About</a>
            <a href="/references">References</a>
        </span>
    </span>
    <span class="header-right">
        {% for social in social_icons %}
        <a class="icon" href="{{ social[1] }}" target="_blank">{{ social[0] }}</a>
        {% endfor %}
    </span>
</header>
